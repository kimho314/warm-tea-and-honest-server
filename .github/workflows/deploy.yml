name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── CI: Build & Test ──────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build & Test
        run: ./gradlew build --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: dev

  # ── CD: Docker Build & Deploy ─────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/warm-tea-and-honest-api:latest
            ${{ secrets.DOCKER_USERNAME }}/warm-tea-and-honest-api:${{ github.sha }}

      - name: Deploy to Oracle Server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/warm-tea-and-honest-api:latest
            docker stop warm-tea-and-honest-api || true
            docker rm warm-tea-and-honest-api || true
            docker run -d \
              --name warm-tea-and-honest-api \
              --restart unless-stopped \
              -p 8080:8080 \
              -e SPRING_DATA_MONGODB_URI="${{ secrets.MONGODB_URI }}" \
              -e SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY="${{ secrets.AWS_ACCESS_KEY }}" \
              -e SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY="${{ secrets.AWS_SECRET_KEY }}" \
              ${{ secrets.DOCKER_USERNAME }}/warm-tea-and-honest-api:latest